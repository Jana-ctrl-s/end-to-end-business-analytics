name: Deploy to Azure Container Apps (Optional Extension)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-azure:
    runs-on: ubuntu-latest
    if: ${{ secrets.AZURE_CREDENTIALS != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push container images to ACR
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}
          docker build -f Dockerfile -t ${{ vars.AZURE_ACR_NAME }}.azurecr.io/novametrics-api:latest .
          docker push ${{ vars.AZURE_ACR_NAME }}.azurecr.io/novametrics-api:latest

      - name: Deploy FastAPI to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: novametrics-api
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ vars.AZURE_ACR_NAME }}.azurecr.io/novametrics-api:latest
