name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8 static lint checks
        run: python -m flake8 src api dashboard tests scripts

      - name: Run full Pytest suite with >= 80% coverage gate
        run: python -m pytest --cov=src --cov=api --cov-report=term-missing --cov-fail-under=80

      - name: Build FastAPI Docker image
        run: docker build -f Dockerfile -t novametrics-api:${{ github.sha }} .

      - name: Build Streamlit Dashboard Docker image
        run: docker build -f Dockerfile.dashboard -t novametrics-dashboard:${{ github.sha }} .
